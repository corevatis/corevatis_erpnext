name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: version-16
  ERPNEXT_BRANCH: version-16
  ERPNEXT_GERMANY_BRANCH: version-16
  DRUCKFORMATE_BRANCH: feature/4.3-angebot-corevatis
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  RUFF_VERSION: "0.14.10"
  IMPORT_LINTER_VERSION: "2.15"
  # Werkzeuge der Test-Bench gepinnt (Review Epic 1, T-3); Actions per Commit-SHA
  FRAPPE_BENCH_VERSION: "5.31.1"
  PIP_LICENSES_VERSION: "5.5.5"
  WKHTMLTOX_RELEASE: "0.12.6.1-3"
  WKHTMLTOX_SHA256: "4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15"

jobs:
  lint:
    name: Lint (ruff, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff check / format --check
        run: |
          pip install "ruff==${RUFF_VERSION}" "import-linter==${IMPORT_LINTER_VERSION}"
          ruff check .
          ruff format --check .
      - name: lint-imports (kein Python-Import aus corevatis)
        run: lint-imports
      - name: Selbsttest Lizenz-Klassifizierung
        run: python .github/helper/licenses.py --selftest

  tests:
    name: ERPNext-v16-Site – Installation und bench run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frappe-/ERPNext-Commits ermitteln (Cache-Schlüssel)
        id: upstream
        run: |
          echo "frappe=$(git ls-remote https://github.com/frappe/frappe "refs/heads/${FRAPPE_BRANCH}" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "erpnext=$(git ls-remote https://github.com/frappe/erpnext "refs/heads/${ERPNEXT_BRANCH}" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pip / yarn
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/yarn
          key: bench-erpnext-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}-${{ steps.upstream.outputs.frappe }}-${{ steps.upstream.outputs.erpnext }}
          restore-keys: |
            bench-erpnext-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client poppler-utils
          # wkhtmltopdf mit gepatchtem Qt (Kopf-/Fußzeilen, Seitenzahlen) wie im Bench-Image;
          # Druckformat-Tests 4.3 rendern damit PDFs
          curl -sSL -o /tmp/wkhtmltox.deb "https://github.com/wkhtmltopdf/packaging/releases/download/${WKHTMLTOX_RELEASE}/wkhtmltox_${WKHTMLTOX_RELEASE}.jammy_amd64.deb"
          echo "${WKHTMLTOX_SHA256}  /tmp/wkhtmltox.deb" | sha256sum -c -
          sudo apt-get install -y -qq /tmp/wkhtmltox.deb fonts-dejavu-core
          wkhtmltopdf --version
          pip install "frappe-bench==${FRAPPE_BENCH_VERSION}" "pip-licenses==${PIP_LICENSES_VERSION}"
          yarn config set cache-folder ~/.cache/yarn

      - name: bench init (Frappe ${{ env.FRAPPE_BRANCH }})
        run: |
          bench init --frappe-branch "${FRAPPE_BRANCH}" --skip-redis-config-generation --skip-assets \
            --python "$(which python)" ~/frappe-bench
        env:
          CI: "Yes"

      - name: ERPNext, deutsche Apps und App holen, Site anlegen, installieren
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --skip-assets --branch "${ERPNEXT_BRANCH}" erpnext
          # wie in der Bench-Gruppe corevatis-v16 (docs/0.3-installationsprotokoll.md im Repo Handwerker)
          bench get-app --skip-assets --branch "${ERPNEXT_GERMANY_BRANCH}" https://github.com/alyf-de/erpnext_germany
          bench get-app --skip-assets --branch "${DRUCKFORMATE_BRANCH}" https://github.com/corevatis/erpnext_druckformate
          bench get-app --skip-assets corevatis_erpnext "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-host 127.0.0.1 --db-root-password root --admin-password admin \
            --mariadb-user-host-login-scope='%' test_site
          bench --site test_site install-app erpnext_germany erpnext_druckformate corevatis_erpnext
          bench --site test_site execute frappe.get_installed_apps
        env:
          CI: "Yes"

      - name: Site-Template Hülshoff anwenden (bench execute, wie auf der Zielsite)
        working-directory: /home/runner/frappe-bench
        run: |
          start=$(date +%s)
          bench --site test_site execute corevatis_erpnext.setup.apply_site_template \
            --kwargs "{\"config_file\": \"$GITHUB_WORKSPACE/corevatis_erpnext/setup/templates/huelshoff.json\"}" | tee apply.json
          echo "Laufzeit: $(( $(date +%s) - start )) s"
          bench --site test_site execute corevatis_erpnext.setup.verify_site_template \
            --kwargs '{"template": "huelshoff"}' > verify.json
          python3 - <<'PY'
          import json
          # letzte Zeile = Rückgabewert von bench execute (JSON)
          result = json.loads(open("verify.json").read().strip().splitlines()[-1])
          print(f"{result['count']} Prüfpunkte, {len(result['failed'])} fehlgeschlagen")
          for line in result["failed"]:
              print("  FEHLT:", line)
          raise SystemExit(0 if result["ok"] else 1)
          PY

      - name: Frappe-Assets bauen (Druckansicht braucht print.bundle.css, Drucktests 4.3)
        working-directory: /home/runner/frappe-bench
        run: |
          bench build --app frappe
          # wkhtmltopdf lädt print.bundle.css über host_name: Webserver der Test-Bench
          bench --site test_site set-config host_name "http://127.0.0.1:8000"
          nohup bench serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/api/method/ping && break; sleep 2; done
          curl -sf -o /dev/null -w "Assets: %{http_code}\n" "http://127.0.0.1:8000/assets/frappe/images/frappe-favicon.svg" || true

      - name: bench run-tests --app corevatis_erpnext
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app corevatis_erpnext
        env:
          # Muster-PDFs des Angebotsdrucks (4.3) für die Freigabe
          CV_MUSTER_DIR: /home/runner/muster

      - name: Muster Angebotsdruck - erste Seite als PNG
        if: always()
        run: |
          ls -l /home/runner/muster || exit 0
          for f in /home/runner/muster/*.pdf; do
            echo "$(basename "$f"): $(pdfinfo "$f" | awk '/^Pages/ {print $2}') Seiten"
            pdftoppm -png -r 110 -f 1 -l 1 -singlefile "$f" "${f%.pdf}-seite1"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: muster-angebotsdruck
          path: /home/runner/muster
          if-no-files-found: ignore

      - name: Katalog Abdichtung per bench execute (nach dem Data Import der Tests - 0 Änderungen)
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute corevatis_erpnext.katalog.importieren \
            --kwargs '{"firma": "Hülshoff Sanierungstechnik"}' > katalog.json
          python3 - <<'PY'
          import json
          result = json.loads(open("katalog.json").read().strip().splitlines()[-1])
          print(f"{result['unveraendert']} unverändert, {len(result['changes'])} Änderungen, "
                f"{len(result['skipped'])} abweichend, {len(result['warnings'])} Hinweise")
          for key in ("changes", "skipped", "warnings"):
              for line in result[key]:
                  print(f"  {key}:", line)
          raise SystemExit(0 if not (result["changes"] or result["skipped"] or result["warnings"]) else 1)
          PY

      - name: Lizenzliste
        run: |
          version="$(python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("corevatis_erpnext/__init__.py").read())[1])')"
          python .github/helper/licenses.py --python ~/frappe-bench/env/bin/python --app corevatis_erpnext \
            --version "$version" --out THIRD_PARTY_LICENSES.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: ignore
