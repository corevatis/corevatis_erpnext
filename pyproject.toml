[project]
name = "corevatis_erpnext"
authors = [
    { name = "Corevatis" }
]
description = "Corevatis-ERPNext-Adapter (GPLv3): Custom Fields, Hooks, Generatoren an ERPNext v16"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "GPL-3.0-only" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0", "erpnext~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Von Press/bench gelesen: kompatible Versionen
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

# Der Adapter ruft die Kern-App corevatis nur über deren whitelisted API
# (frappe.call / corevatis.api.*) auf — keine Python-Imports, keine gemeinsamen
# Datenklassen (docs/mvp-plan.md, Lizenz- und Auslieferungsarchitektur).
[tool.importlinter]
root_package = "corevatis_erpnext"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "corevatis_erpnext importiert corevatis nicht (nur whitelisted API)"
type = "forbidden"
source_modules = ["corevatis_erpnext"]
forbidden_modules = ["corevatis"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
